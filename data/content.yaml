profile:
  name: Edwin Choi
  brand: edwin-choi          # shown in the top-left nav as edwin-choi.dev
  role: Senior Forward Deployed Engineer
  location: Sydney, Australia
  tagline_lead: Building software that is
  tagline_accent: reliable by design.   # this phrase renders in the accent colour
  intro: >
    I'm Edwin Choi, a full-stack engineer with a focus on distributed systems. I care about ease of life, end to end lazy solutions for convenience and automation for efficiency.
    With that, comes clean, scalable architecture, performance I can actually measure, and code the next person can read, from the database to the browser.
  socials:
    - label: github
      url: https://github.com/Edwin-Choi
    - label: linkedin
      url: https://linkedin.com/in/edwinpschoi

about:
  paragraphs:
    - >
      I spent five years building backend services, developer tooling, and a fair
      amount of automation and integration work, the kind of systems teams quietly
      depend on. As a Senior Forward Deployed Engineer at V2 AI, I now work
      full-stack, carrying features from database and infrastructure all the way to
      the interface a customer actually touches.
    - >
      The problems I like best sit somewhere between correctness and elegance, ones
      where one careful design decision saves a team months of pain later, and the
      solution is intuitive. Lately that focus is applied AI: getting models out of
      the notebook and into production systems that are dependable and properly
      instrumented, then owning the full stack, backend, infrastructure, and UI,
      that keeps them running.
  facts:
    - label: Currently
      value: Senior Forward Deploy Engineer @ V2 AI
    - label: Focus
      value: Applied AI, full-stack delivery, backend & infrastructure
    - label: Location
      value: Sydney, Australia
    - label: Open to
      value: Interesting problems & collaboration

